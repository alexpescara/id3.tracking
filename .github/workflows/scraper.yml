name: Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Create scraper configuration
        run: |
          cat > config.yaml <<'EOF'
          project:
            name: id3-market-monitor
            timezone: Europe/Rome

          scraper:
            headless: true
            timeout_ms: 30000
            delay_seconds: 2.5
            max_pages: 5
            max_detail_pages: 30
            user_agent: "ID3-Market-Monitor/0.1 (open-source research project)"

          filters:
            min_year: 2024
            min_battery_kwh: 58
            max_price_eur: 30000

          sources:
            autoscout24:
              enabled: true
              search_url: "https://www.autoscout24.it/lst/volkswagen/id.3?atype=C&cy=I&damaged_listing=exclude&desc=0&fregfrom=2024&powertype=kw"
          EOF
      
      - name: Debug dettaglio AutoScout24
        run: |
          python debug_detail.py

          echo ""
          echo "=== RICERCA 12,9 / INFOTAINMENT ==="

          if [ -f data/raw/debug_detail.txt ]; then
            grep -inE "12[,.]9|12 pollici|infotainment|display|schermo|touchscreen|ready 2 discover" \
              data/raw/debug_detail.txt \
              | head -n 100 || true
          fi

          echo ""
          echo "=== DIMENSIONI FILE ==="
          wc -c data/raw/debug_detail.txt data/raw/debug_detail.html
      
      - name: Analizza HTML dettaglio
        run: |
          echo "=== RICERCA 12,9 / 12.9 NELL'HTML ==="

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("data/raw/debug_detail.html")
          html = path.read_text(encoding="utf-8", errors="ignore")

          patterns = [
              r"12[,.]9",
              r"12[,.]9[^<]{0,100}",
              r".{0,300}12[,.]9.{0,500}",
          ]

          for pattern in patterns:
              print()
              print(f"--- PATTERN: {pattern} ---")

              matches = list(
                  re.finditer(
                      pattern,
                      html,
                      re.IGNORECASE,
                      re.DOTALL,
                  )
              )

              print(f"Occorrenze: {len(matches)}")

              for i, match in enumerate(matches[:20]):
                  start = max(0, match.start() - 500)
                  end = min(len(html), match.end() + 1000)

                  print()
                  print(f"### OCCORRENZA {i + 1} ###")
                  print(
                      html[start:end]
                      .replace("\\u002F", "/")
                      .replace("\\u0022", '"')
                  )

          print()
          print("=== PAROLE TECNICHE ===")

          for term in [
              "infotainment",
              "schermo",
              "display",
              "touchscreen",
              "ready 2 discover",
              "12 pollici",
              "10,25",
              "10.25",
          ]:
              matches = list(
                  re.finditer(
                      re.escape(term),
                      html,
                      re.IGNORECASE,
                  )
              )

              print(
                  f"{term}: {len(matches)} occorrenze"
              )

              for match in matches[:3]:
                  start = max(
                      0,
                      match.start() - 300,
                  )
                  end = min(
                      len(html),
                      match.end() + 500,
                  )

                  print(
                      html[start:end]
                      .replace("\\u002F", "/")
                      .replace("\\u0022", '"')
                  )
                  print("---")
          PY
      
      - name: Run scraper
        run: python -m src.main

      - name: Show generated CSV
        run: |
          if [ -f data/processed/listings.csv ]; then
            echo "CSV generato correttamente:"
            wc -l data/processed/listings.csv
            echo ""
            echo "Prime righe:"
            head -n 5 data/processed/listings.csv
          else
            echo "ERRORE: data/processed/listings.csv non trovato"
            exit 1
          fi

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/listings.csv data/raw/ || true

          if git diff --cached --quiet; then
            echo "Nessuna modifica ai risultati."
          else
            git commit -m "chore: update scraped ID.3 listings"
            git push
          fi
