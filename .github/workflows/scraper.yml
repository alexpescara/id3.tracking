name: Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Create scraper configuration
        run: |
          cat > config.yaml <<'EOF'
          project:
            name: id3-market-monitor
            timezone: Europe/Rome

          scraper:
            headless: true
            timeout_ms: 30000
            delay_seconds: 2.5
            max_pages: 5
            max_detail_pages: 30
            user_agent: "ID3-Market-Monitor/0.1 (open-source research project)"

          filters:
            min_year: 2024
            min_battery_kwh: 58
            max_price_eur: 30000

          sources:
            autoscout24:
              enabled: true
              search_url: "https://www.autoscout24.it/lst/volkswagen/id.3?atype=C&cy=I&damaged_listing=exclude&desc=0&fregfrom=2024&powertype=kw"
          EOF

      - name: Run scraper
        run: python -m src.main

      - name: Show generated CSV
        run: |
          if [ -f data/processed/listings.csv ]; then
            echo "CSV generato correttamente:"
            wc -l data/processed/listings.csv
            echo ""
            echo "Prime righe:"
            head -n 5 data/processed/listings.csv
          else
            echo "ERRORE: data/processed/listings.csv non trovato"
            exit 1
          fi

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/listings.csv data/raw/ || true

          if git diff --cached --quiet; then
            echo "Nessuna modifica ai risultati."
          else
            git commit -m "chore: update scraped ID.3 listings"
            git push
          fi
