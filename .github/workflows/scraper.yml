name: Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python -m src.main

      - name: Show generated CSV
        run: |
          if [ -f data/processed/listings.csv ]; then
            echo "CSV generato correttamente:"
            wc -l data/processed/listings.csv
            echo ""
            echo "Prime righe:"
            head -n 5 data/processed/listings.csv
          else
            echo "ERRORE: data/processed/listings.csv non trovato"
            exit 1
          fi

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/listings.csv data/raw/ || true

          if git diff --cached --quiet; then
            echo "Nessuna modifica ai risultati."
          else
            git commit -m "chore: update scraped ID.3 listings"
            git push
          fi
